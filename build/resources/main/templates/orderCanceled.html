<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gracias por tu compra</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .header {
            background-color: #e6007e;
            color: white;
            text-align: center;
            padding: 20px 0;
        }
        .header h1 {
            margin: 0;
        }
        .section {
            margin-bottom: 20px;
        }
        .section h2 {
            color: #e6007e;
            margin-bottom: 10px;
        }
        .button {
            text-align: center;
            margin: 20px 0;
        }
        .button a {
            text-decoration: none;
            background-color: #e6007e;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
        }
        .details {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f4f4f4;
        }
        .details p {
            margin: 5px 0;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9em;
            color: #666;
        }
        .product {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .product img {
            max-width: 100px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .product-details {
            flex-grow: 1;
            padding-left: 20px;
        }
        .total {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="https://ci3.googleusercontent.com/meips/ADKq_NZ9veCfHK1pJa3Dpnb4uc0lLbk6JPG3WSn8s4uAaqpH9CuCFk4wuHtDixoWvvX67mBbt1UyRAy0KyzhyVGr8bGO38m3bDTxdQrRqq_BeO6ZTnbTnNUuHM_yBhTB-m3kQZN5-YicKmwcmGRikAtyKgBuxylh9FRbMHrejWT9GYvwfg=s0-d-e1-ft#https://image.prom.liverpool.com.mx/lib/fe3211727364047e761678/m/1/707448fc-5a3c-4212-a9d6-e29140346235.png" alt="Logo">
        <h1 th:text="${clientName} + ' ¡Tu compra ha sido CANCELADA!'"></h1>

    </div>

    <div class="section">
        <h2>Detalles de la compra</h2>
        <div class="details">
            <p><strong>Numero de Orden:</strong> <span th:text="${orderId}"></span></p>
            <p><strong>Fecha de compra:</strong> <span th:text="${orderDate}"></span></p>
            <p><strong>Total de compra:</strong> $<span th:text="${total}"></span></p>
        </div>
    </div>

    <div class="section">
        <h2>Estado de la compra</h2>
        <div class="details">
            <p><h2>CENCELADA</h2></p>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2025 Liverpool. Todos los derechos reservados.</p>
    </div>
</div>
</body>
</html>
